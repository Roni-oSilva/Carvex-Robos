<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vídeo Carvex — Robôs de WhatsApp</title>
<!-- Animação controlada por tempo: window.render(t) desenha o quadro do instante t (segundos). scripts/gerar-video.ts captura 30 quadros por segundo. -->
<style>
:root{--az9:#050f45;--az8:#071a6b;--az7:#0b3fd1;--az6:#1456f0;--az5:#1a6bff;--az4:#2f8bff;--ciano:#22d3ee;--ink:#0a1633;--linha:#d3e0ff}
*{box-sizing:border-box;margin:0}
html,body{width:720px;height:1280px;overflow:hidden;background:#eef4ff}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:720px;height:1280px;overflow:hidden;background:linear-gradient(160deg,#f6f9ff,#e3edff)}
.star{position:absolute;pointer-events:none}
#tile{position:absolute;right:34px;top:26px;width:124px;height:124px;border-radius:32px;background:linear-gradient(135deg,#071a6b,#0b3fd1 45%,#1a6bff 80%,#22b8ff);box-shadow:0 18px 40px -14px rgba(11,63,209,.7);display:grid;place-items:center;z-index:50;transform:rotate(9deg)}
#tile img{width:78px}
#marca{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);white-space:nowrap;padding:12px 30px;border-radius:99px;background:#fff;font-weight:800;font-size:23px;letter-spacing:.2em;text-transform:uppercase;color:var(--az7);z-index:60;box-shadow:0 12px 28px -14px rgba(5,15,69,.6)}
#card{position:absolute;left:60px;top:166px;width:600px;height:1000px;border-radius:44px;overflow:hidden;background:#fff;box-shadow:0 40px 80px -30px rgba(5,15,69,.55)}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.sc.dark{background:radial-gradient(120% 70% at 80% 0%,#0b2a9c 0,#071a6b 38%,#050f45 100%);color:#fff}
.sc.light{background:linear-gradient(180deg,#ffffff,#eaf2ff);color:var(--ink)}
.sc.blue{background:linear-gradient(135deg,#071a6b 0%,#0b3fd1 40%,#1a6bff 75%,#22b8ff 100%);color:#fff}
.in{position:absolute;inset:0;padding:44px 40px;display:flex;flex-direction:column}
.c{justify-content:center;align-items:flex-start}
.mk{overflow:hidden;padding:.06em 0 .12em}
.mk>span{display:block;will-change:transform;font-weight:900;letter-spacing:-.055em;line-height:.98}
.g{background:linear-gradient(100deg,#22d3ee,#5aa2ff 60%,#8ab6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.light .g{background:linear-gradient(100deg,#0b3fd1,#1a6bff 55%,#22b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.blue .g{background:none;color:#fff;-webkit-text-fill-color:#fff}
.peq{font-weight:700;font-size:34px;letter-spacing:-.02em;opacity:.92}
.sub{font-weight:600;font-size:31px;line-height:1.3;letter-spacing:-.015em;opacity:.85;margin-top:26px;max-width:480px}
.pill{display:inline-block;padding:14px 28px;border-radius:99px;background:#fff;color:var(--ink);font-weight:800;font-size:31px;letter-spacing:-.02em}
.dark .pill{background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.35)}
.blue .pill{background:#fff;color:var(--az7)}
.row{display:flex;align-items:center;justify-content:space-between;width:100%}
.ico{width:104px;height:104px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(135deg,#0b3fd1,#1a6bff 60%,#22b8ff);box-shadow:0 14px 30px -12px rgba(26,107,255,.8)}
.blue .ico{background:#fff}.blue .ico svg{stroke:var(--az7)}
.ico svg{width:56px;height:56px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nome{font-weight:800;font-size:26px;letter-spacing:.02em;padding:10px 22px;border-radius:99px;border:2px solid currentColor;opacity:.9}
.chat{margin-top:40px;display:flex;flex-direction:column;gap:20px;flex:1}
.b{max-width:470px;padding:22px 28px;border-radius:30px;font-weight:600;font-size:32px;line-height:1.28;letter-spacing:-.01em}
.b.bot{align-self:flex-start;background:#fff;color:var(--ink);border-bottom-left-radius:8px;transform-origin:left bottom;box-shadow:0 10px 26px -14px rgba(5,15,69,.5)}
.b.me{align-self:flex-end;background:linear-gradient(135deg,#0b3fd1,#1a6bff);color:#fff;border-bottom-right-radius:8px;transform-origin:right bottom}
.light .b.bot{border:2px solid var(--linha)}
.blue .b.me{background:var(--az9)}
.chips{align-self:flex-start;display:flex;gap:12px;flex-wrap:wrap;transform-origin:left top}
.chip{padding:13px 26px;border-radius:99px;font-weight:700;font-size:29px;border:2px solid #fff;color:#fff;background:rgba(255,255,255,.08)}
.light .chip{border-color:var(--az6);color:var(--az6);background:#fff}
.foto{width:360px;height:150px;border-radius:18px;background:linear-gradient(135deg,#5aa2ff,#22d3ee);display:grid;place-items:center;margin-bottom:10px}
.foto svg{width:80px;height:80px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-block;padding:26px 44px;border-radius:99px;background:linear-gradient(135deg,#071a6b,#0b3fd1 50%,#1a6bff);color:#fff;font-weight:900;font-size:42px;letter-spacing:-.03em;box-shadow:0 24px 44px -16px rgba(11,63,209,.8)}
.wa{font-weight:800;font-size:38px;letter-spacing:-.02em;color:var(--az7)}
.logo{width:150px}
.ring{position:absolute;pointer-events:none}
.ring circle{fill:none;stroke-linecap:round}
.dark .ring circle{stroke:rgba(34,211,238,.9)}.light .ring circle{stroke:var(--az5)}.blue .ring circle{stroke:#fff}
.bg-ico{position:absolute;right:-60px;top:70px;width:340px;height:340px;opacity:.14;pointer-events:none}
.bg-ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="stage">
  <div class="star" id="s1" style="left:-120px;top:-110px;width:360px;height:360px"></div>
  <div class="star" id="s2" style="right:-150px;bottom:-130px;width:420px;height:420px"></div>
  <div id="tile"><img src="../../site/assets/carvex-simbolo-branco.png" alt=""></div>
  <div id="card"></div>
  <div id="marca">Carvex Tecnologia</div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M5 7V6a2 2 0 0 1 2-2h11v3"/><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="16.5" cy="13.5" r="1.2"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 4V3h6v1M9 11h6M9 15h4"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></symbol>
  </defs>
</svg>
<script>
const W = 720, H = 1280;
const clamp = (x) => Math.min(1, Math.max(0, x));
const E = {
  out: (t) => 1 - Math.pow(1 - t, 3),
  back: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
const svg = (n) => `<svg viewBox="0 0 24 24"><use href="#i-${n}"/></svg>`;

// estrelas (12 pontas) nos cantos
function estrela(el, cor) {
  const pts = []; const n = 12;
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? 36 : 50; const a = (Math.PI * i) / n; pts.push(`${50 + r * Math.cos(a) * 0.98},${50 + r * Math.sin(a) * 0.98}`); }
  el.innerHTML = `<svg viewBox="0 0 100 100" width="100%" height="100%"><defs><linearGradient id="g${cor}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a6bff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><polygon points="${pts.join(" ")}" fill="url(#g${cor})"/></svg>`;
}
estrela(document.getElementById("s1"), 1); estrela(document.getElementById("s2"), 2);

const fs = (txt, max = 124) => Math.min(max, Math.floor(500 / (txt.length * 0.64)));
const mask = (txt, d, cls = "", max = 124) => `<div class="mk"><span class="${cls}" data-a="mask" data-d="${d}" style="font-size:${fs(txt, max)}px">${txt}</span></div>`;
const pop = (html, d, cls = "", tag = "div") => `<${tag} class="${cls}" data-a="pop" data-d="${d}">${html}</${tag}>`;
const ring = (d, size, style) => `<svg class="ring" data-a="ring" data-d="${d}" width="${size}" height="${size}" viewBox="0 0 100 100" style="${style}"><circle cx="50" cy="50" r="46" stroke-width="3" stroke-dasharray="289" stroke-dashoffset="289" transform="rotate(-90 50 50)"/></svg>`;

function robo(tema, icone, nome, palavra, chat) {
  let d = 0.95;
  const itens = chat.map((m) => {
    const h = [];
    if (m.foto) h.push(pop(`<div class="foto">${svg("image")}</div>${m.t}`, d, "b me"));
    else if (m.chips) h.push(pop(m.chips.map((c) => `<span class="chip">${c}</span>`).join(""), d, "chips"));
    else h.push(pop(m.t, d, `b ${m.w}`));
    d += 0.66;
    return h.join("");
  }).join("");
  return {
    dur: 4.4, tema,
    html: `<div class="in">
      <div class="row" data-a="up" data-d="0.15"><div class="ico">${svg(icone)}</div><span class="nome">${nome}</span></div>
      <div style="margin-top:30px"><div class="peq" data-a="up" data-d="0.3">Robô para</div>${mask(palavra, 0.4, "g", 118)}</div>
      <div class="chat">${itens}</div></div>`,
  };
}

const scenes = [
  { dur: 3.4, tema: "dark", html: `<div class="bg-ico" style="color:#5aa2ff">${svg("chat")}</div>${ring(0.1, 420, "right:-120px;bottom:-110px")}
    <div class="in c"><div class="peq" data-a="up" data-d="0.25" style="margin-bottom:6px">Quando o cliente chama</div>
    ${mask("no", 0.45, "", 150)}${mask("WhatsApp", 0.6, "g", 124)}
    <div style="margin-top:28px">${pop("e demora a resposta?", 1.35, "pill")}</div></div>` },
  { dur: 3.2, tema: "light", html: `${ring(0.1, 380, "left:-110px;top:-100px")}
    <div class="in c"><img class="logo" src="../../site/assets/carvex-simbolo-azul.png" alt="" data-a="pop" data-d="0.2" style="margin-bottom:26px">
    <div class="peq" data-a="up" data-d="0.4">Conheça os</div>${mask("Robôs", 0.55, "g", 170)}${mask("Carvex", 0.7, "", 170)}
    <div class="sub" data-a="up" data-d="1.3">Atendem, agendam, cobram e vendem por você, no WhatsApp.</div></div>` },
  robo("dark", "calendar", "AgendaZap", "marcação", [{ w: "me", t: "Quero marcar um horário" }, { w: "bot", t: "Qual dia fica melhor?" }, { chips: ["Qui 08/10", "Sex 09/10"] }, { w: "bot", t: "Agendado! Te lembro antes." }]),
  robo("blue", "wallet", "CobraZap", "cobrança", [{ w: "bot", t: "Sua mensalidade vence em 3 dias." }, { chips: ["Pagar com Pix", "Negociar"] }, { w: "me", t: "Pagar com Pix" }, { w: "bot", t: "Aqui está o Pix copia e cola." }]),
  robo("light", "bag", "PedidoZap", "pedidos", [{ w: "me", t: "Quero uma pizza grande" }, { w: "bot", t: "Pizza Calabresa, total R$ 52,00. Confirmar?" }, { chips: ["Confirmar", "Alterar"] }, { w: "bot", t: "Pedido #1 recebido!" }]),
  robo("dark", "clipboard", "OrcaZap", "orçamento", [{ w: "me", foto: true, t: "Preciso pintar a sala" }, { w: "bot", t: "Orçamento #1: R$ 2.850,00 em 5 dias." }, { chips: ["Aceitar", "Recusar"] }, { w: "bot", t: "Combinado! Vamos marcar." }]),
  robo("light", "home", "LeadZap", "imobiliárias", [{ w: "me", t: "Quero alugar no Centro" }, { w: "bot", t: "Achei uma opção: apartamento de 2 quartos." }, { chips: ["Agendar visita"] }, { w: "bot", t: "Visita marcada! Te lembro antes." }]),
  { dur: 3.8, tema: "blue", html: `${ring(0.1, 440, "right:-140px;top:-120px")}
    <div class="in c"><div class="ico" data-a="pop" data-d="0.2" style="margin-bottom:30px">${svg("shield")}</div>
    ${mask("Não inventa", 0.4, "", 120)}${mask("nada.", 0.55, "", 120)}
    <div class="b bot" data-a="pop" data-d="1.4" style="margin-top:34px;max-width:480px">Não tenho essa informação no momento. Vou encaminhar você para um atendente.</div>
    <div class="sub" data-a="up" data-d="2.2" style="margin-top:22px">Só responde o que você cadastrou.</div></div>` },
  { dur: 3.4, tema: "dark", html: `${ring(0.1, 400, "left:-130px;bottom:-110px")}
    <div class="in c"><div class="peq" data-a="up" data-d="0.2">Segurança de verdade</div>
    ${mask("API oficial", 0.35, "g", 124)}${mask("do WhatsApp", 0.5, "", 124)}
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:34px">${pop("LGPD", 1.2, "pill", "span")}${pop("Painel simples", 1.45, "pill", "span")}${pop("Sem comissão por venda", 1.7, "pill", "span")}</div></div>` },
  { dur: 4.8, tema: "light", html: `${ring(0.1, 420, "right:-120px;top:-120px")}
    <div class="in c" style="align-items:center;text-align:center"><img class="logo" src="../../site/assets/carvex-simbolo-azul.png" alt="" data-a="pop" data-d="0.15" style="margin-bottom:28px">
    <div class="peq" data-a="up" data-d="0.35" style="font-size:38px">Quer um robô no seu negócio?</div>
    <div style="margin:34px 0 30px" data-a="pop" data-d="0.8" data-pulse="1"><span class="btn">Comprar um robô</span></div>
    <div class="wa" data-a="up" data-d="1.5">WhatsApp (91) 98190-2529</div>
    <div class="sub" data-a="up" data-d="1.9" style="margin-top:14px">Carvex Tecnologia</div></div>` },
];

const card = document.getElementById("card");
let acc = 0;
scenes.forEach((s, i) => {
  const el = document.createElement("div");
  el.className = `sc ${s.tema}`; el.innerHTML = s.html; el.style.zIndex = i + 1;
  card.append(el); s.el = el; s.t0 = acc; acc += s.dur;
  s.items = [...el.querySelectorAll("[data-a]")];
});
const TOTAL = acc;

function aplica(s, lt) {
  for (const e of s.items) {
    const a = e.dataset.a, d = parseFloat(e.dataset.d || "0");
    const p = clamp((lt - d) / (a === "ring" ? 1.6 : 0.6));
    if (a === "mask") e.style.transform = `translateY(${(1 - E.out(p)) * 112}%)`;
    else if (a === "pop") {
      const sc = 0.55 + 0.45 * E.back(p);
      const pulso = e.dataset.pulse && p >= 1 ? 1 + 0.035 * Math.sin((lt - d) * 5) : 1;
      e.style.opacity = clamp(p * 3); e.style.transform = `translateY(${(1 - E.out(p)) * 26}px) scale(${sc * pulso})`;
    } else if (a === "up") { e.style.opacity = p; e.style.transform = `translateY(${(1 - E.out(p)) * 44}px)`; }
    else if (a === "ring") { const c = e.querySelector("circle"); c.style.strokeDashoffset = 289 * (1 - E.out(p)); e.style.transform = `rotate(${lt * 22}deg)`; }
  }
}

window.render = function (t) {
  t = Math.min(Math.max(t, 0), TOTAL - 0.001);
  let cur = scenes.findIndex((s) => t < s.t0 + s.dur); if (cur < 0) cur = scenes.length - 1;
  const lt = t - scenes[cur].t0;
  scenes.forEach((s, i) => {
    const vis = i === cur || i === cur - 1;
    s.el.style.display = vis ? "block" : "none";
    if (!vis) return;
    if (i === cur) {
      const p = E.out(clamp(lt / 0.65));
      s.el.style.clipPath = `inset(${(1 - p) * 100}% 0 0 0 round 44px)`;
      aplica(s, lt);
      s.el.style.transform = `scale(${1 + 0.025 * (lt / s.dur)})`;
    } else { s.el.style.clipPath = "none"; aplica(s, 99); s.el.style.transform = "scale(1.025)"; }
  });
  const f = document.getElementById("s1"), g = document.getElementById("s2");
  f.style.transform = `rotate(${t * 9}deg)`; g.style.transform = `rotate(${-t * 7}deg)`;
  document.getElementById("tile").style.transform = `rotate(${9 + Math.sin(t * 2) * 2.5}deg) translateY(${Math.sin(t * 2.4) * 4}px)`;
};
window.TOTAL = TOTAL;
window.render(0);
</script>
</body>
</html>
